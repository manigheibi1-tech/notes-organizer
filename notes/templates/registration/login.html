{% extends 'notes/base.html' %}
{% load static %}
{% block title %}Login{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'notes/css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-form">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
  </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Notes Organizer{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'notes/css/base.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="{% url 'course_list' %}" class="logo">📚 Notes Organizer</a>
      {% if user.is_authenticated %}
        <div class="navbar-right">
          <span class="username">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'logout_confirm' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="btn-secondary">Logout</button>
          </form>
        </div>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}
    {% endblock %}
  </main>
</body>
</html>

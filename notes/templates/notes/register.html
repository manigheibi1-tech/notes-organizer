{% extends 'notes/base.html' %}
{% load static %}
{% block title %}Register{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'notes/css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-form">
    <h2>Register</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
  </div>
</div>
{% endblock %}

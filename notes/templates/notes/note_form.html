{% extends 'notes/base.html' %}
{% load static %}
{% block title %}Note Form{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'notes/css/forms.css' %}">
{% endblock %}
{% block content %}
<h2>Note for {{ course.title }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>
{% endblock %}
